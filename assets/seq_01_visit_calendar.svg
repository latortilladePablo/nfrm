" y="845" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">5. Validar y guardar Visit</text><text x="757" y="863" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">e intención en una</text><text x="757" y="881" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">transacción</text><line x1="955" y1="1008" x2="750" y2="1008" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="757" y="950" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">6. Commit y versión nueva</text><line x1="750" y1="1113" x2="340" y2="1113" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="347" y="1055" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">7. Visit guardada, sincronización pendiente</text><line x1="1160" y1="1218" x2="955" y2="1218" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="962" y="1160" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">8. Leer intención pendiente</text><text x="962" y="1178" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">tras el commit</text><line x1="955" y1="1323" x2="1160" y2="1323" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="962" y="1265" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">9. Correlación, versión y</text><text x="962" y="1283" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">payload</text><line x1="1160" y1="1428" x2="1365" y2="1428" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="1167" y="1370" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">10. Aplicar sólo la versión</text><text x="1167" y="1388" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">vigente</text><line x1="1365" y1="1533" x2="1570" y2="1533" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="1372" y="1475" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">11. Sincronización</text><text x="1372" y="1493" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">soportada por el conector</text><line x1="1570" y1="1638" x2="1160" y2="1638" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="1167" y="1580" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">12. Resultado o conflicto externo</text><line x1="1160" y1="1743" x2="955" y2="1743" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="962" y="1685" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">13. Registrar resultado y</text><text x="962" y="1703" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">reintento cuando</text><text x="962" y="1721" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">corresponda</text><rect x="30" y="1780" width="1620" height="66" fill="#fff3d5"/><text x="45" y="1803" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Fin de condición</text><rect x="30" y="1885" width="1620" height="66" fill="#fff3d5"/><text x="45" y="1908" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Visit conserva autoridad; cambios externos requieren resolución explícita</text></svg>