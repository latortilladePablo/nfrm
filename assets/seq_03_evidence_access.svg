<svg xmlns="http://www.w3.org/2000/svg" width="1475" height="1680" viewBox="0 0 1475 1680"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#567187"/></marker></defs><rect width="100%" height="100%" fill="#f6f8fb"/><text x="30" y="35" font-family="Arial" font-size="24" font-weight="bold" fill="#15334b">Carga y acceso a evidencias</text><text x="30" y="61" font-family="Arial" font-size="14" fill="#526678">Secuencia lógica propuesta · autorización, correlación y resultado observable · pendiente de prueba</text><line x1="135" y1="165" x2="135" y2="1650" stroke="#b7cad7" stroke-dasharray="5,5"/><rect x="45" y="90" width="180" height="80" rx="8" fill="#e7f2f5" stroke="#aabfce"/><text x="61" y="116" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Usuario</text><text x="61" y="155" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b"></text><line x1="340" y1="165" x2="340" y2="1650" stroke="#b7cad7" stroke-dasharray="5,5"/><rect x="250" y="90" width="180" height="80" rx="8" fill="#e7f2f5" stroke="#aabfce"/><text x="266" y="116" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Evidencias</text><text x="266" y="155" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b"></text><line x1="545" y1="165" x2="545" y2="1650" stroke="#b7cad7" stroke-dasharray="5,5"/><rect x="455" y="90" width="180" height="80" rx="8" fill="#e7f2f5" stroke="#aabfce"/><text x="471" y="116" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">EvidenceService</text><text x="471" y="137" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">propuesto</text><text x="471" y="155" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b"></text><line x1="750" y1="165" x2="750" y2="1650" stroke="#b7cad7" stroke-dasharray="5,5"/><rect x="660" y="90" width="180" height="80" rx="8" fill="#e7f2f5" stroke="#aabfce"/><text x="676" y="116" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Política y ámbito</text><text x="676" y="155" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b"></text><line x1="955" y1="165" x2="955" y2="1650" stroke="#b7cad7" stroke-dasharray="5,5"/><rect x="865" y="90" width="180" height="80" rx="8" fill="#e7f2f5" stroke="#aabfce"/><text x="881" y="116" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Visit, Acuerdo o</text><text x="881" y="137" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Journey</text><text x="881" y="155" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b"></text><line x1="1160" y1="165" x2="1160" y2="1650" stroke="#b7cad7" stroke-dasharray="5,5"/><rect x="1070" y="90" width="180" height="80" rx="8" fill="#e7f2f5" stroke="#aabfce"/><text x="1086" y="116" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">ContentVersion y</text><text x="1086" y="137" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">vínculos</text><text x="1086" y="155" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b"></text><line x1="1365" y1="165" x2="1365" y2="1650" stroke="#b7cad7" stroke-dasharray="5,5"/><rect x="1275" y="90" width="180" height="80" rx="8" fill="#e7f2f5" stroke="#aabfce"/><text x="1291" y="116" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Intención de</text><text x="1291" y="137" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">notificación</text><text x="1291" y="155" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b"></text><line x1="135" y1="273" x2="340" y2="273" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="142" y="215" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">1. Cargar evidencia con</text><text x="142" y="233" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">clasificación</text><line x1="340" y1="378" x2="545" y2="378" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="347" y="320" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">2. Archivo, padre, clave</text><text x="347" y="338" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">idempotente</text><line x1="545" y1="483" x2="750" y2="483" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="425" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">3. Verificar capacidad,</text><text x="552" y="443" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">CRUD/FLS y padre</text><line x1="750" y1="588" x2="955" y2="588" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="757" y="530" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">4. Comprobar dealer y</text><text x="757" y="548" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">estado</text><line x1="955" y1="693" x2="750" y2="693" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="757" y="635" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">5. Ámbito confirmado</text><line x1="750" y1="798" x2="545" y2="798" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="740" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">6. Autorizar operación</text><text x="552" y="758" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">acotada</text><line x1="545" y1="903" x2="1160" y2="903" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="845" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">7. Crear versión y vínculo permitido</text><line x1="1160" y1="1008" x2="545" y2="1008" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="950" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">8. Documento y versión</text><line x1="545" y1="1113" x2="1365" y2="1113" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="1055" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">9. Destinatarios derivados en servidor</text><line x1="545" y1="1218" x2="340" y2="1218" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="347" y="1160" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">10. Confirmación</text><line x1="135" y1="1323" x2="545" y2="1323" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="142" y="1265" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">11. Descargar por ID</text><line x1="545" y1="1428" x2="750" y2="1428" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="1370" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">12. Revalidar acceso actual</text><text x="552" y="1388" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">y revocación</text><line x1="750" y1="1533" x2="545" y2="1533" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><text x="552" y="1475" font-family="Arial" font-size="13" font-weight="normal" fill="#15334b">13. Permitir o denegar</text><rect x="30" y="1570" width="1415" height="66" fill="#fff3d5"/><text x="45" y="1593" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Nombre del perfil y botón oculto no son autorización</text></svg>