nt-weight="bold" fill="#15334b">UAT</text><text x="676" y="190" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Dueños de cuatro módulos</text><text x="676" y="209" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Seguridad y operación</text><text x="676" y="228" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Evidencia aceptada</text><line x1="935" y1="210" x2="965" y2="210" stroke="#567187" stroke-width="2" marker-end="url(#arr)"/><rect x="975" y="125" width="275" height="180" rx="8" fill="#fff" stroke="#aabfce"/><text x="991" y="151" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Producción</text><text x="991" y="190" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Release aprobado</text><text x="991" y="209" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Corte semanas 17–20</text><text x="991" y="228" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Hypercare 21–22</text><rect x="30" y="375" width="1220" height="115" rx="8" fill="#fff" stroke="#aabfce"/><text x="46" y="401" font-family="Arial" font-size="16" font-weight="bold" fill="#15334b">Artefactos promovidos y control por ambiente</text><text x="46" y="440" font-family="Arial" font-size="14" font-weight="normal" fill="#15334b">Manifiesto + configuración sin secretos + contrato de datos + pruebas + rollback. La aprobación de documentos no habilita por sí sola el despliegue.</text></svg>