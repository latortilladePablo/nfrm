const frame=document.getElementById('document'),select=document.getElementById('sections'),back=document.getElementById('back');
const stack=[];let current='home',lastAnchor='';
const preferred=['home','01_Arquitectura_y_alcance','02_Modelo_de_datos','03_Seguridad','04_Contratos_modulos','05_Componentes_LWC','06_Integraciones','07_Migracion_y_operacion','08_Pruebas_y_aprobaciones','09_ADR','10_Modelo_Datos_por_Sprint'];
const keys=[...preferred.filter(k=>BUNDLE.pages[k]),...Object.keys(BUNDLE.pages).filter(k=>!preferred.includes(k))];
for(const key of keys){const option=document.createElement('option');option.value=key;option.textContent=BUNDLE.pages[key].title;select.appendChild(option)}
function route(id,anchor='',remember=true){
 if(!BUNDLE.pages[id])return;
 if(remember&&current!==id)stack.push(current);current=id;lastAnchor=anchor;back.disabled=stack.length===0;select.value=id;
 document.getElementById('pageTitle').textContent=BUNDLE.pages[id].historical?'Antecedente':'Documento de diseño';
 document.title='FFT · '+BUNDLE.pages[id].title;frame.src=BUNDLE.pages[id].file;
 try{history.replaceState(null,'','#seccion='+encodeURIComponent(id))}catch(e){}
}
frame.addEventListener('load',()=>{if(lastAnchor){try{frame.contentDocument.getElementById(lastAnchor)?.scrollIntoView()}catch(e){}}});
function download(id){const a=BUNDLE.assets[id];if(!a)return;const link=document.createElement('a');link.href=a.file;link.download=a.name;document.body.appendChild(link);link.click();link.remove()}
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||!event.data?.fftPortal)return;

 if(d.action==='page')route(d.id,d.anchor||'');
 if(d.action==='download')download(d.id);
 if(d.action==='image'&&BUNDLE.assets[d.id]){
  const a=BUNDLE.assets[d.id];stack.push(current);back.disabled=false;
  frame.src=a.file;
 }
});
